<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trello Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/board.css" />
  <link rel="stylesheet" href="css/lists.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <nav class="navbar">
    <div class="brand"><i class="fa-brands fa-trello"></i> Trello Clone</div>
    <button id="refreshBtn" class="btn btn-light" type="button"><i class="fa-solid fa-rotate"></i> <span class="btn-text">Refresh</span></button>
  </nav>

  <header class="board-header"><h1 id="boardTitle">Loading board...</h1></header>

  <div id="errorBox" class="error-box" hidden></div>
  <main id="board" class="board" aria-live="polite"></main>

  <div id="loader" class="loader" hidden><div class="spinner"></div></div>
  <div id="toasts" class="toasts"></div>

  <!-- Prompt modal (create / rename for everything) -->
  <div id="promptModal" class="modal" hidden>
    <div class="modal-box small">
      <form id="promptForm" novalidate>
        <h2 id="promptTitle"></h2>
        <label id="promptLabel" for="promptInput"></label>
        <input id="promptInput" type="text" maxlength="512" autocomplete="off" />
        <p id="promptError" class="field-error"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button id="promptSubmit" type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm modal -->
  <div id="confirmModal" class="modal" hidden>
    <div class="modal-box small">
      <h2>Are you sure?</h2>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button id="confirmOk" type="button" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Card detail modal -->
  <div id="cardModal" class="modal" hidden>
    <div class="modal-box large">
      <div class="card-modal-head">
        <h2 id="cardTitle"></h2>
        <button id="renameCardBtn" class="icon-btn" type="button" title="Rename card"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-btn" type="button" data-close title="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="muted" id="cardListName"></p>
      <div class="section-head">
        <h3><i class="fa-regular fa-square-check"></i> Checklists</h3>
        <button id="addChecklistBtn" class="btn btn-primary btn-sm" type="button"><i class="fa-solid fa-plus"></i> Add checklist</button>
      </div>
      <div id="checklistArea"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/board.js"></script>
  <script src="js/lists.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/checklists.js"></script>
  <script src="js/checkitems.js"></script>
</body>
</html>
